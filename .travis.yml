sudo: false
language: node_js
node_js:
  - 22
cache:
  directories:
    - ~/.local/share/pnpm/store
before_install:
  - npm install --global pnpm@11.11.0
install:
  - pnpm install --frozen-lockfile
branches:
  only:
    - main
script:
  - hexo generate # generate static files
deploy:
  provider: pages
  skip-cleanup: true
  github-token: $GH_TOKEN
  keep-history: true
  on:
    branch: master
  local-dir: public
